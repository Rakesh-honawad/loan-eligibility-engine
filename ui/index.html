<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Eligibility Engine - User Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-box {
            border: 3px dashed #667eea;
            padding: 50px;
            text-align: center;
            border-radius: 15px;
            background: #f8f9ff;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-box:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .file-info {
            margin: 20px 0;
            color: #333;
            font-size: 14px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Loan Eligibility Engine</h1>
        <p class="subtitle">Upload user data CSV to start the matching process</p>
        
        <div class="upload-box" onclick="document.getElementById('csvFile').click()">
            <label class="file-label">
                📁 Click to select CSV file
            </label>
            <input type="file" id="csvFile" accept=".csv" onchange="handleFileSelect()">
            <div class="file-info" id="fileInfo"></div>
        </div>
        
        <button id="uploadBtn" onclick="uploadFile()" disabled>Upload & Process</button>
        <div class="loader" id="loader"></div>
        <div id="status"></div>
    </div>

    <script>
        let selectedFile = null;
        const BUCKET_NAME = 'YOUR_BUCKET_NAME'; // Will be updated after deployment
        const REGION = 'us-east-1';

        function handleFileSelect() {
            const fileInput = document.getElementById('csvFile');
            selectedFile = fileInput.files[0];
            
            if (selectedFile) {
                document.getElementById('fileInfo').innerHTML = 
                    `✅ Selected: <strong>${selectedFile.name}</strong><br>
                     Size: ${(selectedFile.size / 1024).toFixed(2)} KB`;
                document.getElementById('uploadBtn').disabled = false;
            }
        }

        async function uploadFile() {
            if (!selectedFile) return;
            
            const uploadBtn = document.getElementById('uploadBtn');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            
            uploadBtn.disabled = true;
            loader.style.display = 'block';
            status.style.display = 'none';
            
            try {
                // For local testing, use direct AWS SDK upload
                // In production, get presigned URL from Lambda
                
                showStatus('Uploading file to S3...', 'info');
                
                // Simulate upload (replace with actual S3 upload)
                const formData = new FormData();
                formData.append('file', selectedFile);
                
                // This is a placeholder - you'll replace with actual S3 upload
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                showStatus('✅ File uploaded successfully! Processing users...', 'success');
                
                setTimeout(() => {
                    showStatus('🎉 Processing complete! Users matched with loan products.', 'success');
                }, 3000);
                
            } catch (error) {
                showStatus(`❌ Upload failed: ${error.message}`, 'error');
            } finally {
                loader.style.display = 'none';
                uploadBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
